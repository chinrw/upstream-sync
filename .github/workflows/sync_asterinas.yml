name: Sync Asterinas upstream

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-asterinas-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'chinrw/upstream-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fast-forward the fork's main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SSH_KEY: ${{ secrets.ASTERINAS_SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          sync_dir=$(mktemp -d "$RUNNER_TEMP/upstream-sync.XXXXXX")
          trap 'rm -rf "$sync_dir"' EXIT
          printf '%s\n' "$SYNC_SSH_KEY" > "$sync_dir/id_ed25519"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$sync_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$sync_dir/id_ed25519' -o UserKnownHostsFile='$sync_dir/known_hosts' -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes"

          upstream_url=https://github.com/asterinas/asterinas.git
          fork_url=git@github.com:chinrw/asterinas.git
          upstream_sha=$(git ls-remote --exit-code "$upstream_url" refs/heads/main | cut -f1)
          fork_sha=$(git ls-remote --exit-code "$fork_url" refs/heads/main | cut -f1)
          if [[ "$upstream_sha" == "$fork_sha" ]]; then
            echo "main is already up to date at $upstream_sha."
            exit 0
          fi

          git init --bare "$sync_dir/repository.git"
          cd "$sync_dir/repository.git"
          git fetch --filter=blob:none --no-tags "$fork_url" refs/heads/main:refs/remotes/fork/main
          git fetch --filter=blob:none --no-tags "$upstream_url" refs/heads/main:refs/remotes/upstream/main
          if ! git merge-base --is-ancestor refs/remotes/fork/main refs/remotes/upstream/main; then
            echo "::error::Fork main contains commits absent from upstream. Synchronization stopped to preserve them."
            exit 1
          fi

          # A normal push also rejects divergence introduced after the fetch.
          git push "$fork_url" refs/remotes/upstream/main:refs/heads/main
          echo "main was fast-forwarded to $(git rev-parse refs/remotes/upstream/main)."
